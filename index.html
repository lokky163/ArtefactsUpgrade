<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор ресурсов артефактов</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #121214; color: #e1e1e6; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
        .container { max-width: 500px; width: 100%; background: #202024; padding: 25px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); align-self: flex-start; }
        h1 { font-size: 1.5rem; margin-bottom: 15px; color: #fff; text-align: center; }
        p { font-size: 0.9rem; color: #8d8d99; margin-bottom: 15px; line-height: 1.4; }
        textarea { 
            width: 100%; 
            min-height: 100px; 
            background: #121214; 
            border: 2px solid #29292e; 
            border-radius: 6px; 
            color: #fff; 
            padding: 12px; 
            font-size: 1rem; 
            resize: none; 
            outline: none; 
            transition: border-color 0.2s; 
            overflow-y: hidden; 
            display: block;
        }
        textarea:focus { border-color: #04d361; }
        .btn { width: 100%; background: #04d361; color: #000; font-weight: bold; border: none; padding: 14px; border-radius: 6px; font-size: 1rem; cursor: pointer; margin-top: 15px; transition: background 0.2s; }
        .btn:hover { background: #00b34d; }
        
        .results { margin-top: 25px; border-top: 1px solid #29292e; padding-top: 10px; }
        
        /* Стили общего итога */
        .grand-total { background: #29292e; padding: 18px; border-radius: 8px; margin-top: 12px; border: 2px solid #04d361; }
        .grand-title { font-weight: bold; font-size: 1.2rem; color: #fff; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        /* Стили детальных блоков */
        .block-item { background: #1a1a1e; padding: 15px; border-radius: 8px; margin-top: 12px; border-left: 4px solid #48485a; }
        .block-title { font-weight: bold; font-size: 1.05rem; color: #fff; margin-bottom: 8px; }
        
        .res-line { display: flex; justify-content: space-between; font-size: 0.95rem; margin-top: 4px; }
        .res-line span:last-child { font-weight: bold; color: #04d361; }
        .rainbow span:last-child { color: #ff79c6; }
        .error-msg { color: #f75a68; text-align: center; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Калькулятор артефактов</h1>
    <p>Введите целевые уровни через запятую или <b>Enter</b>. Все введенные значения суммируются в общем итоге, но в списке ниже дубликаты скрыты.</p>
    
    <textarea id="levelsInput" placeholder="Пример:&#10;160&#10;120&#10;120" rows="4"></textarea>
    <button class="btn" onclick="calculateResources()">Рассчитать затраты</button>

    <div class="results" id="resultsContainer">
        <!-- Результаты выведутся здесь -->
    </div>
</div>

<script>
const stepCosts = {};

function initCosts() {
    // Обычные уровни прокачки
    addRange(1, 10, 10, 0);
    addRange(11, 21, 30, 0);
    addRange(21, 30, 50, 0);
    addRange(31, 41, 70, 0);
    addRange(41, 50, 90, 0);
    addRange(51, 61, 110, 0);
    addRange(61, 70, 130, 0);
    addRange(71, 81, 150, 0);
    addRange(81, 90, 170, 0);
    addRange(91, 101, 190, 0);
    addRange(101, 110, 210, 0);
    addRange(111, 121, 230, 0);
    addRange(121, 130, 250, 0);
    addRange(131, 141, 270, 0);
    addRange(141, 150, 290, 0);
    addRange(151, 161, 310, 0);
    addRange(161, 170, 330, 0);
    addRange(171, 181, 350, 0);
    addRange(181, 190, 370, 0);
    addRange(191, 200, 390, 0);

    // Уровни прорыва (Breakthrough) — ТЕПЕРЬ ЗАПИСЫВАЮТСЯ ПРАВИЛЬНО
    stepCosts[10]  = { white: 50,   rainbow: 60 };
    stepCosts[30]  = { white: 250,  rainbow: 220 };
    stepCosts[50]  = { white: 450,  rainbow: 380 };
    stepCosts[70]  = { white: 650,  rainbow: 540 };
    stepCosts[90]  = { white: 850,  rainbow: 700 };
    stepCosts[110] = { white: 1050, rainbow: 860 };
    stepCosts[130] = { white: 1250, rainbow: 1020 };
    stepCosts[150] = { white: 1450, rainbow: 1180 };
    stepCosts[170] = { white: 1650, rainbow: 1340 };
    stepCosts[190] = { white: 1850, rainbow: 1500 };
}

function addRange(start, end, white, rainbow) {
    for (let i = start; i < end; i++) {
        stepCosts[i] = { white, rainbow };
    }
}

initCosts();

// Авторасширение поля ввода
const tx = document.getElementById('levelsInput');
tx.addEventListener("input", OnInput, false);

function OnInput() {
    this.style.height = 'auto';
    this.style.height = (this.scrollHeight) + 'px';
}

function calculateResources() {
    const input = document.getElementById('levelsInput').value;
    const matches = input.match(/\d+/g);
    const container = document.getElementById('resultsContainer');
    
    container.innerHTML = ''; 

    // Получаем полный список введенных уровней
    const allLevels = matches 
        ? matches.map(x => parseInt(x, 10)).filter(x => x >= 1 && x <= 200)
        : [];

    if (allLevels.length === 0) {
        container.innerHTML = '<div class="error-msg">Введите корректные уровни от 1 до 200</div>';
        return;
    }

    let grandWhite = 0;
    let grandRainbow = 0;

    // Считаем общий итог по всем введенным значениям (включая дубликаты)
    allLevels.forEach(targetLvl => {
        for (let l = 1; l < targetLvl; l++) {
            if (stepCosts[l]) {
                grandWhite += stepCosts[l].white;
                grandRainbow += stepCosts[l].rainbow;
            }
        }
    });

    // Оставляем только уникальные уровни для отображения в списке ниже
    const uniqueLevels = [...new Set(allLevels)].sort((a, b) => a - b);
    let blocksHtml = '';

    uniqueLevels.forEach(targetLvl => {
        let totalWhite = 0;
        let totalRainbow = 0;

        for (let l = 1; l < targetLvl; l++) {
            if (stepCosts[l]) {
                totalWhite += stepCosts[l].white;
                totalRainbow += stepCosts[l].rainbow;
            }
        }

        // Генерируем детальную строчку (только для уникальных)
        blocksHtml += `
            <div class="block-item">
                <div class="block-title">От 1 до ${targetLvl} ур.</div>
                <div class="res-line">
                    <span>Белая руда:</span>
                    <span>${totalWhite.toLocaleString('ru-RU')}</span>
                </div>
                <div class="res-line rainbow">
                    <span>Радужная руда:</span>
                    <span>${totalRainbow.toLocaleString('ru-RU')}</span>
                </div>
            </div>
        `;
    });

    // Карточка главного итога
    const grandTotalHtml = `
        <div class="grand-total">
            <div class="grand-title">Общий итог стоимости:</div>
            <div class="res-line" style="font-size: 1.15rem;">
                <span>Всего белой руды:</span>
                <span>${grandWhite.toLocaleString('ru-RU')}</span>
            </div>
            <div class="res-line rainbow" style="font-size: 1.15rem; margin-top: 6px;">
                <span>Всего радужной руды:</span>
                <span>${grandRainbow.toLocaleString('ru-RU')}</span>
            </div>
        </div>
    `;

    container.innerHTML = grandTotalHtml + blocksHtml;
}
</script>

</body>
</html>
