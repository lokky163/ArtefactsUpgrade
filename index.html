<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор ресурсов артефактов</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #121214; color: #e1e1e6; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 500px; width: 100%; background: #202024; padding: 25px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
        h1 { font-size: 1.5rem; margin-bottom: 15px; color: #fff; text-align: center; }
        p { font-size: 0.9rem; color: #8d8d99; margin-bottom: 15px; line-height: 1.4; }
        textarea { width: 100%; height: 100px; background: #121214; border: 2px solid #29292e; border-radius: 6px; color: #fff; padding: 12px; font-size: 1rem; resize: none; outline: none; transition: border-color 0.2s; }
        textarea:focus { border-color: #04d361; }
        .btn { width: 100%; background: #04d361; color: #000; font-weight: bold; border: none; padding: 14px; border-radius: 6px; font-size: 1rem; cursor: pointer; margin-top: 15px; transition: background 0.2s; }
        .btn:hover { background: #00b34d; }
        .results { margin-top: 25px; border-top: 1px solid #29292e; padding-top: 20px; }
        .res-item { display: flex; justify-content: space-between; padding: 10px 0; font-size: 1.1rem; border-bottom: 1px solid #121214; }
        .res-item span:last-child { font-weight: bold; color: #04d361; }
        .rainbow span:last-child { color: #ff79c6; }
    </style>
</head>
<body>

<div class="container">
    <h1>Калькулятор артефактов</h1>
    <p>Введите уровни через запятую (например: <b>1, 50, 105</b>). Калькулятор посчитает суммарные затраты на прокачку от минимального до максимального из указанных уровней.</p>
    
    <textarea id="levelsInput" placeholder="Пример: 1, 11, 35, 51"></textarea>
    <button class="btn" onclick="calculateResources()">Рассчитать затраты</button>

    <div class="results">
        <div class="res-item">
            <span>Белая руда (Refining Stone):</span>
            <span id="whiteOreOut">0</span>
        </div>
        <div class="res-item rainbow">
            <span>Радужная руда (Star Essence):</span>
            <span id="rainbowOreOut">0</span>
        </div>
    </div>
</div>

<script>
// Генерация базы данных по стоимости каждого шага (от lvl до lvl + 1)
const stepCosts = {};

function initCosts() {
    const intervals = [
        [1, 10, 10, 0], [10, 11, 50, 60], [11, 21, 30, 0], [21, 30, 50, 0], [30, 31, 250, 220],
        [31, 41, 70, 0], [41, 50, 90, 0], [50, 51, 450, 380], [51, 61, 110, 0], [61, 70, 130, 0],
        [70, 71, 650, 540], [71, 81, 150, 0], [81, 90, 170, 0], [90, 91, 850, 700], [91, 101, 190, 0],
        [101, 110, 210, 0], [110, 111, 1050, 860], [111, 121, 230, 0], [121, 130, 250, 0],
        [130, 131, 1250, 1020], [131, 141, 270, 0], [141, 150, 290, 0], [150, 151, 1450, 1180],
        [151, 161, 310, 0], [161, 170, 330, 0], [170, 171, 1650, 1340], [171, 181, 350, 0],
        [181, 190, 370, 0], [190, 191, 1850, 1500], [191, 200, 390, 0]
    ];

    intervals.forEach(([start, end, white, rainbow]) => {
        if (end === start + 1) {
            stepCosts[start] = { white, rainbow };
        } else {
            for (let i = start; i < end; i++) {
                stepCosts[i] = { white, rainbow };
            }
        }
    });
}

initCosts();

function calculateResources() {
    const input = document.getElementById('levelsInput').value;
    // Парсим числа из строки
    const levels = input.split(',')
                        .map(x => parseInt(x.trim(), 10))
                        .filter(x => !isNaN(x) && x >= 1 && x <= 200);

    if (levels.length < 2) {
        document.getElementById('whiteOreOut').innerText = 'Нужно мин. 2 уровня';
        document.getElementById('rainbowOreOut').innerText = 'Нужно мин. 2 уровня';
        return;
    }

    // Определяем диапазон от минимального до максимального введенного уровня
    const minLvl = Math.min(...levels);
    const maxLvl = Math.max(...levels);

    let totalWhite = 0;
    let totalRainbow = 0;

    for (let l = minLvl; l < maxLvl; l++) {
        if (stepCosts[l]) {
            totalWhite += stepCosts[l].white;
            totalRainbow += stepCosts[l].rainbow;
        }
    }

    document.getElementById('whiteOreOut').innerText = totalWhite.toLocaleString('ru-RU');
    document.getElementById('rainbowOreOut').innerText = totalRainbow.toLocaleString('ru-RU');
}
</script>

</body>
</html>
